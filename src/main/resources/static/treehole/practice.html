<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Practice Info - MUST Treehole</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="../css/treehole/particles.css">
</head>
<body>

<nav class="navbar">
  <div class="nav-logo">
    <button class="btn btn-sm" onclick="history.back()"><i class="fas fa-arrow-left"></i> Back</button>
  </div>
  <div class="nav-search-center">
    <div style="font-size:1.1rem;font-weight:700;color:var(--text)">Practice Info</div>
  </div>
  <div class="nav-actions">
    <button class="btn btn-sm" id="nightToggle"><i class="fas fa-moon"></i></button>
  </div>
</nav>

<div class="practice-tabs">
  <button class="practice-tab" data-tab="group">Class Group</button>
  <button class="practice-tab" data-tab="competition">Competition</button>
  <button class="practice-tab" data-tab="internship">Internship</button>
</div>

<div class="practice-page-wrap">
<div class="tab-panel" id="panel-group">
  <div id="recruit-group"></div>
  <div class="section-title"><i class="fas fa-fire"></i> Popular Class Groups</div>
  <div id="list-group"></div>
</div>

<div class="tab-panel" id="panel-competition">
  <div id="recruit-competition"></div>
  <div class="section-title"><i class="fas fa-fire"></i> Popular Competitions</div>
  <div id="list-competition"></div>
</div>

<div class="tab-panel" id="panel-internship">
  <div id="recruit-internship"></div>
  <div class="section-title"><i class="fas fa-fire"></i> Popular Internships</div>
  <div id="list-internship"></div>
</div>
</div>

<div class="modal-overlay" id="recruitModal">
  <div class="modal-box">
    <div class="modal-title" id="modalTitle">Find Teammates</div>
    <form id="recruitForm" novalidate>
      <div class="form-group">
        <label class="form-label" for="fieldMajor">College / Major</label>
        <input class="form-input" id="fieldMajor" type="text" placeholder="e.g. Computer Science, Software Engineering" required>
      </div>
      <div class="form-group">
        <label class="form-label" for="fieldGrade">Grade</label>
        <select class="form-select" id="fieldGrade">
          <option value="Freshman">Freshman</option>
          <option value="Sophomore">Sophomore</option>
          <option value="Junior">Junior</option>
          <option value="Senior">Senior</option>
          <option value="Graduate">Graduate</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label" for="fieldSkills">Skills & Strengths</label>
        <textarea class="form-textarea" id="fieldSkills" placeholder="e.g. Programming, data analysis, copywriting..."></textarea>
      </div>
      <div class="form-group">
        <label class="form-label" for="fieldIntro">Self Introduction</label>
        <textarea class="form-textarea" id="fieldIntro" placeholder="Briefly introduce yourself..."></textarea>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn" id="modalCancel">Cancel</button>
        <button type="submit" class="btn btn-primary">Post Recruitment</button>
      </div>
    </form>
  </div>
</div>

<script src="../js/app/treehole/particles.js"></script>
</body>
</html>
