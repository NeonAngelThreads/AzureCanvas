<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Club Hub - MUST Treehole</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="../css/treehole/style.css">
  <link rel="stylesheet" href="../css/treehole/club.css">
</head>
<body>

<nav class="navbar">
  <div class="nav-logo">
    <button class="btn btn-sm" onclick="history.back()" style="font-weight:400"><i class="fas fa-arrow-left"></i> Back</button>
  </div>
  <div class="nav-search-center">
    <div style="font-size:1.1rem;font-weight:700;color:var(--text)">Club Hub</div>
  </div>
  <div class="nav-actions">
    <button class="btn btn-sm" id="nightBtn"><i class="fas fa-moon"></i></button>
  </div>
</nav>

<div class="club-page">
  <!-- club hero -->
  <div class="club-hero" id="clubHero">
    <div class="club-hero-emblem" id="heroEmblem"></div>
    <div class="club-hero-info">
      <div class="club-hero-name" id="heroName"></div>
      <div class="club-hero-desc" id="heroDesc"></div>
      <div class="club-hero-stats">
        <div class="club-stat"><strong id="heroMemberCount"></strong> Members</div>
        <div class="club-stat"><strong id="heroActivityCount"></strong> Recent Activities</div>
      </div>
    </div>
    <button class="club-join-btn" id="joinBtn">+ Join Club</button>
  </div>

  <!-- tabs -->
  <div class="club-tabs">
    <button class="club-tab active" data-tab="intro"><i class="fas fa-info-circle"></i> Club Intro</button>
    <button class="club-tab" data-tab="activity"><i class="fas fa-calendar-alt"></i> Activities</button>
    <button class="club-tab" data-tab="forum"><i class="fas fa-comments"></i> Forum</button>
    <button class="club-tab" data-tab="chat"><i class="fas fa-comment-dots"></i> Chat</button>
  </div>

  <!-- intro panel -->
  <div class="club-panel active" id="panel-intro">
    <div class="intro-section">
      <div class="intro-section-title">Club Description</div>
      <div id="introFullDesc" style="font-size:0.95rem;line-height:1.8;color:var(--text)"></div>
    </div>
    <div class="intro-section">
      <div class="intro-section-title">Current Leader</div>
      <div class="leader-card">
        <div class="leader-avatar" id="leaderAvatar"></div>
        <div class="leader-info">
          <div class="leader-name" id="leaderName"></div>
          <div class="leader-meta" id="leaderMeta"></div>
        </div>
      </div>
    </div>
    <div class="intro-section">
      <div class="intro-section-title">Club Members</div>
      <div class="members-row" id="membersRow"></div>
    </div>
  </div>

  <!-- activity panel -->
  <div class="club-panel" id="panel-activity">
    <div id="activityList"></div>
  </div>

  <!-- forum panel -->
  <div class="club-panel" id="panel-forum">
    <div class="forum-input-card">
      <textarea class="forum-input" id="forumInput" placeholder="Post in the club forum…"></textarea>
      <div class="forum-input-footer">
        <button class="btn btn-primary btn-sm" id="forumPostBtn">Post</button>
      </div>
    </div>
    <div id="forumList"></div>
  </div>

  <!-- chat panel -->
  <div class="club-panel" id="panel-chat">
    <div class="chat-apply-box" id="chatApplyBox">
      <div class="chat-apply-icon">💬</div>
      <div class="chat-apply-title">Join Club Chat Room</div>
      <div class="chat-apply-sub">After approval by club administrator, you can chat with club members in real-time</div>
      <button class="chat-apply-btn" id="chatApplyBtn">Apply to Join</button>
      <div class="chat-status" id="chatStatus"></div>
    </div>
    <div class="chat-room" id="chatRoom">
      <div class="chat-room-header">
        <div class="chat-online-dot"></div>
        <span id="chatRoomTitle"></span>
        <span style="font-size:0.78rem;color:var(--text-muted);margin-left:auto" id="chatOnlineCount"></span>
      </div>
      <div class="chat-messages" id="chatMessages"></div>
      <div class="chat-input-bar">
        <input class="chat-input" id="chatInput" placeholder="Send message…" autocomplete="off">
        <button class="btn btn-primary btn-sm" id="chatSendBtn">Send</button>
      </div>
    </div>
  </div>
</div>

<script src="../js/app/treehole/clubs.js"></script>
</body>
</html>
