<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Campus Story Map - Full-stack Prototype</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- 字体图标 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: '#7c3aed'
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="../css/storymap/primary.css">
</head>
<body>

    <!-- 导航栏 - 最初布局：首页、探索、登录，新增天气组件 -->
    <div class="navbar">
        <div class="logo">
            <h1>
                <i class="fas fa-map-marked-alt"></i>
                Campus Story Map
            </h1>
        </div>
        <div class="nav-links">
            <!-- 天气组件 -->
            <div class="weather-widget" id="weatherWidget">
                <span>Macau</span>
                <div class="custom-select" id="areaSelectCustom">
                    <button class="select-trigger">Taipa <i class="fas fa-chevron-down"></i></button>
                    <ul class="select-options">
                        <li data-value="taipa">Taipa</li>
                        <li data-value="coloane">Coloane</li>
                        <li data-value="peninsula">Peninsula</li>
                    </ul>
                </div>
                <i id="weatherIcon" class="fas fa-cloud-sun weather-icon"></i>
                <span id="weatherTemp" class="weather-temp">--°C</span>
            </div>
            <a href="../index.html"><i class="fas fa-home"></i> Home</a>
            <a id="exploreBtn"><i class="fas fa-compass"></i> Explore</a>

            <a class="search-container">
                <input type="text" class="search-input" id="search-input" placeholder="Search stories...">
            </a>
            <a href="../login/index.html?redirect=../storymap/index.html" class="btn-login" id="login-btn"><i class="fas fa-user"></i> Login</a>
        </div>
    </div>

    <!-- 探索面板 -->
    <div id="explorePanel" class="explore-panel">
        <input type="text" id="searchInput" class="search-input" placeholder="Search Macau... e.g. Ruins of St. Paul's, Taipa" autocomplete="off">
        <div id="searchResults" class="search-results"></div>
    </div>

    <!-- 主内容 -->
    <div class="main-container">
        <div class="map-container">
            <div id="map"></div>
        </div>
        <div class="stories-sidebar">
            <div class="sidebar-header">
                <h3><i class="fas fa-book-open"></i> Stories Nearby</h3>
                <div class="filter-buttons">
                    <button class="filter-btn active" data-category="all">All</button>
                    <button class="filter-btn" data-category="study">📚 Study</button>
                    <button class="filter-btn" data-category="life">🍜 Life</button>
                    <button class="filter-btn" data-category="emotion">💕 Emotion</button>
                    <button class="filter-btn" data-category="event">🎉 Event</button>
                </div>
            </div>
            <div class="stories-list" id="storiesList">
                <div style="text-align: center; padding: 40px; color: #999;">
                    <i class="fas fa-spinner fa-spin"></i> Loading...
                </div>
            </div>
        </div>
    </div>

    <!-- 发布故事按钮 -->
    <button class="fab" id="fabBtn">
        <i class="fas fa-plus"></i>
    </button>

    <!-- 左下角定位/科大按钮 -->
    <div class="map-controls">
        <button id="locateIpBtn" class="ctrl-btn"><i class="fas fa-location-dot"></i></button>
        <button id="resetMapBtn" class="ctrl-btn"><i class="fas fa-home"></i></button>
    </div>

    <!-- 发布故事模态框 -->
    <div class="modal" id="storyModal">
        <div class="modal-content">
            <h2><i class="fas fa-feather-alt"></i> Share Your Story</h2>
            <input type="text" id="storyTitle" placeholder="Story Title *" maxlength="50">
            <select id="storyCategory">
                <option value="study">📚 Study Stories</option>
                <option value="life">🍜 Daily Life</option>
                <option value="emotion">💕 Memories</option>
                <option value="event">🎉 Campus Events</option>
            </select>
            <textarea id="storyContent" placeholder="Share your story... (100-500 words)" maxlength="500"></textarea>
            <input type="text" id="storyLocation" placeholder="Location Name (Optional)" value="MUST">
            <div class="coord-hint" id="coordHint">💡 Tip: Double-click map to get coordinates</div>
            <div class="modal-buttons">
                <button class="btn-cancel" id="cancelModal">Cancel</button>
                <button class="btn-submit" id="submitStory">Publish</button>
            </div>
        </div>
    </div>

    <!-- 故事详情弹窗 -->
    <div class="story-detail-overlay" id="storyDetailOverlay">
        <div class="story-detail-modal">
            <div class="story-detail-header">
                <h3 id="detailTitle">Story Title</h3>
                <button class="close-detail-btn" id="closeDetailBtn">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="story-detail-body" id="detailBody"></div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script src="../js/app/storymap/controlls.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</body>
</html>
